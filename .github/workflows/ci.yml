name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript SDK and Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck -w @nkanf-dev/pico-store-sdk
      - run: npm pack --dry-run -w @nkanf-dev/pico-store-sdk

  python:
    name: Python SDK and CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.15.22 build hatchling
      - run: python -m pip install -e packages/python
      - run: ruff check packages/python tools
      - run: ruff format --check packages/python tools
      - run: PYTHONPATH=packages/python/src python -m unittest discover -s packages/python/tests -v
      - run: python -m build packages/python

  rust:
    name: Rust SDK and Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-desktop
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo package -p pico-store-lab

  android:
    name: Kotlin SDK and PICO APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: cd apps/android && ./gradlew --no-daemon testDebugUnitTest assembleDebug :sdk:assembleRelease
