name: Prepare Lab release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag
        required: true

permissions:
  contents: write

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - name: Create draft from reviewed release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          notes="docs/releases/${RELEASE_TAG#v}.md"
          test -s "$notes"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --draft --verify-tag \
            --title "PICO Store Lab ${RELEASE_TAG#v}" --notes-file "$notes"
          release_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)"
          gh api "repos/$GH_REPO/releases/$release_id" > "$RUNNER_TEMP/release.json"
          python3 - "$RELEASE_TAG" "$RUNNER_TEMP/release.json" <<'PY'
          import json, sys
          release = json.load(open(sys.argv[2]))
          if release['tag_name'] != sys.argv[1] or not release['draft'] or release['assets']:
              raise SystemExit('Prepared release differs from the reviewed draft')
          PY
