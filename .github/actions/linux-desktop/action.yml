name: Linux desktop build dependencies
description: Install native dependencies for GPUI and system credential storage
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang cmake pkg-config libfontconfig1-dev libfreetype6-dev libxcb1-dev libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libssl-dev
