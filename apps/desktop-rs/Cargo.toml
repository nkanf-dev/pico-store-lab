[package]
name = "pico-store-desktop"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
repository.workspace = true
description = "Native GPUI desktop app for browsing and downloading PICO apps"
readme = "README.md"
keywords = ["pico", "vr", "desktop", "gpui"]
categories = ["gui"]

[[bin]]
name = "pico-store-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
gpui-kit = "=0.6.4"
directories = "6"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
pico-store-lab = { path = "../../packages/rust", version = "0.1.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

ureq = "3"
semver = "1"
