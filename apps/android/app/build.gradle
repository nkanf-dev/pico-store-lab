plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def bridgeEnabled = providers.gradleProperty('matrixBridgeDir').isPresent()
def projectLinks = new groovy.json.JsonSlurper().parseText(
    providers.fileContents(layout.projectDirectory.file('../../../project-links.json')).asText.get())
def releaseSigning = [
    storeFile: providers.environmentVariable('PICO_ANDROID_KEYSTORE').orNull,
    keyAlias: providers.environmentVariable('PICO_ANDROID_KEY_ALIAS').orNull,
    storePassword: providers.environmentVariable('PICO_ANDROID_STORE_PASSWORD').orNull,
    keyPassword: providers.environmentVariable('PICO_ANDROID_KEY_PASSWORD').orNull,
]
if (releaseSigning.values().any { it } && !releaseSigning.values().every { it }) {
    throw new GradleException('Provide all four PICO_ANDROID signing environment variables')
}
if (bridgeEnabled) {
    def bundleDir = providers.gradleProperty('matrixBundleDir')
    def profileDir = providers.gradleProperty('matrixProfileDir')
    tasks.register('copyMatrixBundle', Sync) {
        from providers.provider {
            if (!bundleDir.isPresent() || !file(bundleDir.get() + '/bundle.json').isFile())
                throw new GradleException('Provide -PmatrixBundleDir with a prepared Matrix Bridge bundle directory')
            file(bundleDir.get())
        }
        into "$buildDir/generated/matrix-assets/matrix-bridge"
    }
    tasks.named('preBuild').configure { dependsOn 'copyMatrixBundle' }
    tasks.register('copyMatrixProfiles', Sync) {
        from providers.provider {
            if (!profileDir.isPresent() || !file(profileDir.get()).isDirectory())
                throw new GradleException('Provide -PmatrixProfileDir with signed profile APKs')
            def files = file(profileDir.get()).listFiles().findAll {
                it.isFile() && it.name ==~ /matrix-profile-[a-z][a-z0-9_]{0,63}\.apk/
            }
            if (files.isEmpty()) throw new GradleException('No signed profile APKs in matrixProfileDir')
            def routes = [:]
            files.each { apk ->
                new java.util.zip.ZipFile(apk).withCloseable { archive ->
                    def entry = archive.getEntry('assets/profile.json')
                    if (entry == null || entry.size > 4 * 1024 * 1024)
                        throw new GradleException("Missing profile recipe: $apk.name")
                    def recipe = archive.getInputStream(entry).withCloseable { input ->
                        new groovy.json.JsonSlurper().parse(input, 'UTF-8')
                    }
                    def key = apk.name.substring('matrix-profile-'.length(), apk.name.length() - '.apk'.length())
                    def profile = recipe.profile
                    def matcher = profile?.packageMatcher
                    def priority = profile?.priority
                    if (profile?.profileKey != key || !(priority instanceof Integer) ||
                        !(matcher == '*' || matcher ==~ /[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+/) ||
                        profile.profileVersionCode != recipe.profileVersionCode)
                        throw new GradleException("Invalid profile identity or match rule: $apk.name")
                    def route = "$matcher:$priority".toString()
                    if (routes.containsKey(route))
                        throw new GradleException("Ambiguous profile match rule $route: ${routes[route]} and $key")
                    routes[route] = key
                }
            }
            files
        }
        into "$buildDir/generated/profile-assets"
    }
    tasks.named('preBuild').configure { dependsOn 'copyMatrixProfiles' }
}

tasks.register('copyStoreCatalog', Copy) {
    from '../../../contracts/v1/catalog.json'
    into "$buildDir/generated/catalog-assets"
}
tasks.named('preBuild').configure { dependsOn 'copyStoreCatalog' }

dependencies {
    implementation project(':sdk')
    implementation 'com.android.tools.build:apksig:9.4.0'
    if (bridgeEnabled) implementation 'org.picomatrix.bridge:installer-android:0.1.0-dev'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation platform('androidx.compose:compose-bom:2026.08.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.core:core-ktx:1.17.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

android {
    namespace 'dev.nkanf.picostore'
    sourceSets.main.assets.srcDir "$buildDir/generated/catalog-assets"
    sourceSets.main.kotlin.srcDir(bridgeEnabled ? 'src/matrix/java' : 'src/standalone/java')
    if (bridgeEnabled) sourceSets.main.assets.srcDir "$buildDir/generated/matrix-assets"
    if (bridgeEnabled) sourceSets.main.assets.srcDir "$buildDir/generated/profile-assets"
    compileSdk 37

    defaultConfig {
        applicationId 'dev.nkanf.picostore'
        minSdk 29
        targetSdk 35
        versionCode 7
        versionName '0.1.3'
        ['githubHost', 'githubApiHost', 'githubOwner', 'storeRepository', 'bridgeRepository',
         'websiteOrigin', 'picoRegistrationUrl'].each { field ->
            buildConfigField 'String', field.toUpperCase(java.util.Locale.ROOT), groovy.json.JsonOutput.toJson(projectLinks[field])
        }
    }

    buildFeatures { compose true; buildConfig true }

    if (releaseSigning.values().every { it }) {
        signingConfigs {
            release {
                storeFile file(releaseSigning.storeFile)
                keyAlias releaseSigning.keyAlias
                storePassword releaseSigning.storePassword
                keyPassword releaseSigning.keyPassword
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }
    buildTypes.release.debuggable = false

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}
