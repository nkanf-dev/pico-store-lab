plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

tasks.register('copyStoreCatalog', Copy) {
    from '../../../contracts/v1/catalog.json'
    into "$buildDir/generated/catalog-assets"
}
tasks.named('preBuild').configure { dependsOn 'copyStoreCatalog' }

dependencies {
    implementation project(':sdk')
    implementation platform('androidx.compose:compose-bom:2026.08.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.core:core-ktx:1.17.0'
    testImplementation 'junit:junit:4.13.2'
}

android {
    namespace 'dev.nkanf.picostore'
    sourceSets.main.assets.srcDir "$buildDir/generated/catalog-assets"
    compileSdk 37

    defaultConfig {
        applicationId 'dev.nkanf.picostore'
        minSdk 29
        targetSdk 35
        versionCode 7
        versionName '0.1.3'
    }

    buildFeatures { compose true; buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
